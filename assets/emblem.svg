       ואינו מתיימר לייצג אותו — placeholder לשימוש בהדגמת הפורטפוליו. -->
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e3a63"/>
      <stop offset="100%" stop-color="#0d1b3e"/>
    </linearGradient>
  </defs>

  <path d="M48 5 L86 18 v30 c0 22-16 37-38 43 C26 85 10 70 10 48 V18 Z"
